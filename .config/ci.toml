# fig-lua's CI, as data. `.github/workflows/ci.yml` reads this file and runs one
# job per `[[job]]` table, in a runner of its own; `release ci` runs the same
# jobs on your machine, in this order, with the same shell, and stops at the
# first that fails. Changing CI — adding a job, renaming one, changing what one
# runs — is an edit here and nowhere else.
#
# Each job: `id` (what `release ci <id>` takes), `name` (the check GitHub shows
# as `CI / <name>` — renaming it renames the required status check), `run` (run
# by `bash -eo pipefail -c` at the repository root), `components` (rustup
# components the runner installs) and `builds` (whether the cargo cache is worth
# restoring; default true).
#
# Cheapest and most likely to fail first.

[[job]]
id = "fmt"
name = "Format"
run = "cargo fmt --all --check"
components = "rustfmt"
builds = false

# Warnings are errors in CI, so they are errors here too — a lint that only
# fires on the runner is a lint found too late.
[[job]]
id = "clippy"
name = "Clippy"
run = "cargo clippy --workspace --all-targets -- -D warnings"
components = "clippy"

# `--all-targets` is deliberately not passed: it excludes doctests, and this
# crate's documentation carries most of its worked examples.
[[job]]
id = "test"
name = "Test"
run = "cargo test --workspace"

# Worth a job of its own here more than in most crates: nearly every type is
# documented by pointing at another (`Consequence` at `Tint`,
# `FindingKind::TintNotRead` at `Tint::ALL`), and an intra-doc link that stops
# resolving takes the explanation with it while the code still compiles.
[[job]]
id = "doc"
name = "Docs"
run = "RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps"

# A build, not a test run: MSRV is a promise about who can compile fig-lua, and
# the dev-dependencies need not hold to it. The version is read from
# `[workspace.package] rust-version`, so the pin follows the declared floor.
# `rustup run` rather than `cargo +<version>`, which only rustup's proxy knows.
[[job]]
id = "msrv"
name = "MSRV"
run = '''
version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
test -n "$version" || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
echo "MSRV from Cargo.toml: $version"
rustup toolchain install "$version" --profile minimal --no-self-update
rustup run "$version" cargo build --workspace
'''

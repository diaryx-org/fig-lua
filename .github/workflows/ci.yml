name: CI
# Build, lint, and test fig-lua on every push and pull request.
#
# There is deliberately almost nothing here. The jobs are `[[job]]` tables in
# .config/ci.toml, read by the plan job below, so changing CI — adding a job,
# renaming one, changing what a job runs — is an edit to that file alone.
# `release ci` runs the same jobs locally, in the same order, with the same
# shell.
#
# What the runner still owns is the toolchain, because only it knows how to
# install one: stable Rust and the components a job asks for.
on:
  push: { branches: [main] }
  pull_request: null
  workflow_dispatch: null

# Cancel superseded runs on the same ref — a new push makes the old one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Read what CI consists of. Python's tomllib is on every runner already, so this
  # installs nothing and builds nothing. A field a job leaves out gets the same
  # default `release ci` gives it.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
    - uses: actions/checkout@v7
    - id: plan
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'PY'
        import json, tomllib
        with open(".config/ci.toml", "rb") as f:
            jobs = tomllib.load(f)["job"]
        matrix = [
            {
                "id": j["id"],
                "name": j["name"],
                "run": j["run"],
                "components": j.get("components", ""),
                "builds": j.get("builds", True),
            }
            for j in jobs
        ]
        print("jobs=" + json.dumps(matrix, separators=(",", ":")))
        PY

  # One runner per job in that table. `name` is the job's own, so these appear as
  # `CI / Format`, `CI / Clippy`, … — rename a job in ci.toml and the required
  # status check is renamed with it.
  run:
    name: ${{ matrix.job.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One red job should not hide the state of the others.
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with: { components: "${{ matrix.job.components }}" }
    - uses: Swatinem/rust-cache@v2
      if: matrix.job.builds
    # Through the environment rather than spliced into the script, so the
    # command reaches bash exactly as ci.toml wrote it.
    - env: { JOB_RUN: "${{ matrix.job.run }}" }
      run: bash -eo pipefail -c "$JOB_RUN"
